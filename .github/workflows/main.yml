name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
              python3-pip \
              build-essential \
              libssl-dev \
              libffi-dev \
              python3-dev \
              libjpeg-dev \
              zlib1g-dev \
              libpng-dev \
              libfreetype6-dev \
              libtiff-dev \
              libwebp-dev \
              libxcb1-dev \
              libx11-dev \
              libxext-dev \
              libxrender-dev \
              libxi-dev \
              libxrandr-dev \
              libxcursor-dev \
              libxinerama-dev \
              libxcomposite-dev \
              libxdamage-dev \
              libxfixes-dev \
              libxshmfence-dev \
              libxxf86vm-dev \
              libxkbcommon-dev

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shanghua-apk
          path: bin/*.apk
